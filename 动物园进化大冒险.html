<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe6ff">
<title>动物园进化大冒险</title>
<style>
:root{--ink:#3b2f4a;--sub:#7b6f8a;--card:#ffffff;--line:#eadff5;--pri:#ff7a59;--pri2:#ffb347;--grn:#3fc27a;--red:#f0565f;--blue:#4d9bff;--bg1:#bfe6ff;--bg2:#fff3d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%) fixed;line-height:1.5;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.wrap{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}
.chips{display:flex;gap:8px}
.chip{background:#ffffffcc;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;box-shadow:0 2px 0 #00000012}
.scene{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#9fd8ff 0%,#d6f1ff 62%,#b8ecb0 62%,#8fd98c 100%);box-shadow:0 6px 0 #00000014;padding:14px 12px 10px;text-align:center}
.scene:before,.scene:after{content:"";position:absolute;background:#fff;border-radius:99px;opacity:.85;height:22px}
.scene:before{width:80px;left:-20px;top:30px;animation:drift 18s linear infinite alternate}
.scene:after{width:60px;right:-10px;top:60px;animation:drift 14s linear infinite alternate-reverse}
.bubble{position:relative;z-index:2;display:inline-block;max-width:92%;background:#fff;border-radius:18px;padding:8px 14px;font-size:15px;font-weight:600;box-shadow:0 3px 0 #0000001a;min-height:38px}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.pet{position:relative;z-index:1;width:min(300px,78vw);margin:14px auto 0;cursor:pointer;touch-action:manipulation}
.pet svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 6px 0 #0000001a);animation:bob 3.2s ease-in-out infinite}
.pet.shiny svg{filter:hue-rotate(150deg) saturate(1.25) drop-shadow(0 0 10px #ffe27a)}
.pet.jump svg{animation:jump .5s ease}
.pet.shake svg{animation:shake .5s ease}
.pet .egg{animation:wob 2.6s ease-in-out infinite;transform-origin:50% 90%}
.pet.hit .egg{animation:wobhit .35s ease}
.shadow{width:46%;height:14px;background:#0000001f;border-radius:50%;margin:-6px auto 0}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
.name{font-size:22px;font-weight:800;margin-top:6px}
.tag{display:inline-block;background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;border-radius:99px;font-size:13px;padding:2px 12px;margin-left:6px;vertical-align:middle;font-weight:700}
.bar{height:16px;background:#ffffffaa;border-radius:99px;overflow:hidden;margin:10px 6px 2px;box-shadow:inset 0 2px 0 #0000001a}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7be08a,#3fc27a);border-radius:99px;transition:width .5s}
.barinfo{font-size:13px;color:#4a5a4a;font-weight:600}
.daily{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:10px 14px;margin:14px 0;box-shadow:0 3px 0 #0000000d;font-size:14px;font-weight:600}
.daily .mini{flex:1;height:10px;background:#f1e8fb;border-radius:99px;overflow:hidden}
.daily .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri))}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:block;width:100%;border-radius:20px;padding:14px 10px;font-weight:800;font-size:17px;color:#fff;box-shadow:0 5px 0 #0000002a;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0000002a}
.btn small{display:block;font-size:12px;font-weight:600;opacity:.9}
.b-en{background:linear-gradient(180deg,#5aa9ff,#3b86e8)}
.b-math{background:linear-gradient(180deg,#ff9a6b,#f2693d)}
.b-mix{grid-column:1/3;background:linear-gradient(180deg,#a97cff,#7f55e0)}
.b-ok{background:linear-gradient(180deg,#52d68c,#2fb36d)}
.b-ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #0000001a}
.links{display:flex;gap:12px;margin-top:14px}
.links .btn{font-size:15px;padding:11px 8px}
.h2{font-size:20px;font-weight:800;margin:6px 0 4px}
.hint{color:var(--sub);font-size:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:var(--card);border-radius:20px;padding:8px 4px 8px;text-align:center;box-shadow:0 3px 0 #0000000f;border:3px solid transparent;position:relative}
.cell.on{border-color:var(--pri);background:#fff8f2}
.cell svg{width:100%;height:auto;display:block}
.cell b{display:block;font-size:14px}
.cell em{display:block;font-style:normal;font-size:11px;color:var(--sub)}
.cell.lock svg{filter:brightness(0) opacity(.16)}
.cell .star{position:absolute;right:6px;top:4px;font-size:11px}
.sticky{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));margin-top:16px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bd{background:#fff;border-radius:16px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center}
.bd span{font-size:24px}.bd b{display:block;font-size:13px}.bd i{font-style:normal;color:var(--sub);font-size:11px}
.bd.off{opacity:.45;filter:grayscale(1)}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{width:38px;height:38px;border-radius:50%;background:#fff;font-size:18px;box-shadow:0 3px 0 #0000001a}
.dots{flex:1;display:flex;gap:6px}
.dots i{flex:1;height:10px;border-radius:99px;background:#ffffff99}
.dots i.ok{background:var(--grn)}.dots i.bad{background:var(--red)}.dots i.now{background:var(--pri2)}
.combo{font-weight:800;font-size:15px;min-width:52px;text-align:right}
.qcard{background:#fff;border-radius:26px;padding:18px 16px;text-align:center;box-shadow:0 5px 0 #0000001a;animation:pop .3s ease}
.qtag{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--blue);border-radius:99px;padding:1px 10px}
.qtag.m{background:var(--pri)}
.qemoji{font-size:64px;line-height:1.1;margin:6px 0}
.qtext{font-size:24px;font-weight:800;margin:6px 0;line-height:1.4;word-break:break-word}
.qtext.s{font-size:19px}
.spell{letter-spacing:4px;font-size:32px}
.spk{margin-top:6px;background:#eaf3ff;color:#2f6fd0;border-radius:99px;padding:8px 18px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{background:#fff;border-radius:20px;padding:16px 8px;font-size:20px;font-weight:800;box-shadow:0 5px 0 #0000001a;border:3px solid transparent;transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#dcf8e8;border-color:var(--grn)}.opt.bad{background:#ffe3e5;border-color:var(--red)}.opt:disabled{cursor:default}
.inp{display:flex;gap:10px;margin-top:16px}
.inp input{flex:1;min-width:0;border:3px solid var(--line);border-radius:18px;padding:12px;font:inherit;font-size:26px;font-weight:800;text-align:center;color:var(--ink);background:#fff;outline:none;user-select:text;-webkit-user-select:text}
.inp input:focus{border-color:var(--blue)}
.inp .btn{width:auto;padding:0 22px}
.fb{margin-top:16px;border-radius:20px;padding:12px 14px;font-weight:700;animation:pop .25s ease}
.fb.ok{background:#dcf8e8;color:#16743f}.fb.bad{background:#ffe3e5;color:#a8323a}
.fb p{margin:2px 0 0;font-weight:600;font-size:14px}
.qpet{width:110px;margin:14px auto 0}
.qpet svg{width:100%;height:auto;display:block;overflow:visible}
.qpet.shiny svg{filter:hue-rotate(150deg) saturate(1.25)}
.res{text-align:center}
.res .big{font-size:56px;margin:6px 0 0}
.res .score{font-size:28px;font-weight:800}
.rows{background:#fff;border-radius:20px;padding:10px 16px;margin:14px 0;text-align:left;box-shadow:0 3px 0 #0000000d}
.rows div{display:flex;justify-content:space-between;padding:5px 0;font-weight:600}
.rows b{color:var(--pri)}
.overlay{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#fff7c9,#ffd27a 55%,#ff9a6b);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .4s}
.evo{text-align:center;max-width:420px;width:100%}
.evo .t{font-size:26px;font-weight:900;color:#7a2d00}
.evo .s{font-size:17px;font-weight:700;margin:6px 0 12px;color:#7a3d10}
.evo .pet{width:min(280px,70vw);margin-top:0;cursor:default}
.evo .legend{font-size:34px;font-weight:900;background:linear-gradient(90deg,#ff6b6b,#ffb347,#ffe14a,#4cd18a,#4d9bff,#a97cff);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:80;background:#3b2f4a;color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;font-size:15px;box-shadow:0 4px 12px #0003;animation:toast 3s ease forwards;white-space:nowrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;animation:fall linear forwards}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-28px) scale(1.05,.95)}70%{transform:translateY(0) scale(.96,1.05)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes wob{0%,100%{transform:rotate(0)}8%{transform:rotate(-3deg)}16%{transform:rotate(3deg)}24%{transform:rotate(0)}}
@keyframes wobhit{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-9deg) scale(1.04)}60%{transform:rotate(8deg) scale(1.04)}100%{transform:rotate(0) scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.4}50%{transform:scale(1.15);opacity:1}}
@keyframes pop{0%{transform:scale(.92);opacity:.3}100%{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(70px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* =====================================================================
   动物园进化大冒险 —— 30 种动物，做英语/数学任务，让宠物从蛋进化成传说神兽
   ===================================================================== */

/* ---------- 等级 ---------- */
const LV = [0, 30, 120, 300, 600];            // 进入各阶段所需经验
const STAGE = ["神秘蛋", "萌新幼崽", "活力少年", "闪耀成年", "传说神兽"];
const stageOf = xp => LV.filter(t => xp >= t).length - 1;
const progressOf = xp => {
  const s = stageOf(xp);
  if (s >= 4) return { stage: s, pct: 1, need: 0, next: null };
  return { stage: s, pct: (xp - LV[s]) / (LV[s + 1] - LV[s]), need: LV[s + 1] - xp, next: STAGE[s + 1] };
};

/* ---------- 画动物 (SVG) ---------- */
const INK = "#2b2118", LINE = "rgba(70,45,30,.22)";
let uidN = 0;
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + amt)));
  return "#" + [n >> 16, (n >> 8) & 255, n & 255].map(v => f(v).toString(16).padStart(2, "0")).join("");
};

function earSVG(type, c, ic, side) {
  const X = x => (side < 0 ? x : 200 - x);
  const rot = (a, cx, cy) => `transform="rotate(${side < 0 ? a : -a} ${cx} ${cy})"`;
  switch (type) {
    case "round": return `<circle cx="${X(58)}" cy="58" r="16" fill="${c}" stroke="${LINE}" stroke-width="2"/><circle cx="${X(58)}" cy="58" r="9" fill="${ic}"/>`;
    case "nub": return `<circle cx="${X(66)}" cy="56" r="11" fill="${c}" stroke="${LINE}" stroke-width="2"/><circle cx="${X(66)}" cy="56" r="5.5" fill="${ic}"/>`;
    case "point": return `<path d="M${X(54)} 74 L${X(56)} 34 L${X(90)} 56 Z" fill="${c}" stroke="${c}" stroke-width="7" stroke-linejoin="round"/><path d="M${X(60)} 64 L${X(61)} 46 L${X(78)} 56 Z" fill="${ic}"/>`;
    case "tall": return `<path d="M${X(54)} 76 L${X(48)} 18 L${X(92)} 54 Z" fill="${c}" stroke="${c}" stroke-width="7" stroke-linejoin="round"/><path d="M${X(58)} 66 L${X(55)} 36 L${X(80)} 56 Z" fill="${ic}"/>`;
    case "long": return `<ellipse cx="${X(76)}" cy="30" rx="12" ry="36" fill="${c}" stroke="${LINE}" stroke-width="2" ${rot(-9, X(76), 62)}/><ellipse cx="${X(76)}" cy="34" rx="6" ry="25" fill="${ic}" ${rot(-9, X(76), 62)}/>`;
    case "floppy": return `<ellipse cx="${X(50)}" cy="98" rx="14" ry="27" fill="${c}" stroke="${LINE}" stroke-width="2" ${rot(16, X(50), 80)}/>`;
    case "big": return `<ellipse cx="${X(42)}" cy="98" rx="27" ry="35" fill="${c}" stroke="${LINE}" stroke-width="2"/><ellipse cx="${X(45)}" cy="100" rx="17" ry="25" fill="${ic}"/>`;
    case "side": return `<circle cx="${X(50)}" cy="98" r="14" fill="${c}" stroke="${LINE}" stroke-width="2"/><circle cx="${X(50)}" cy="98" r="8" fill="${ic}"/>`;
    case "small": return `<ellipse cx="${X(48)}" cy="76" rx="15" ry="8" fill="${c}" stroke="${LINE}" stroke-width="2" ${rot(-26, X(48), 76)}/><ellipse cx="${X(48)}" cy="76" rx="9" ry="4" fill="${ic}" ${rot(-26, X(48), 76)}/>`;
    case "llama": return `<ellipse cx="${X(72)}" cy="36" rx="9" ry="26" fill="${c}" stroke="${LINE}" stroke-width="2" ${rot(-16, X(72), 62)}/><ellipse cx="${X(72)}" cy="40" rx="4.5" ry="17" fill="${ic}" ${rot(-16, X(72), 62)}/>`;
    case "koala": return `<circle cx="${X(50)}" cy="64" r="24" fill="${c}" stroke="${LINE}" stroke-width="2"/><circle cx="${X(50)}" cy="64" r="14" fill="${ic}"/>`;
    case "rhino": return `<ellipse cx="${X(60)}" cy="54" rx="10" ry="14" fill="${c}" stroke="${LINE}" stroke-width="2" ${rot(-22, X(60), 62)}/><ellipse cx="${X(60)}" cy="56" rx="5" ry="8" fill="${ic}" ${rot(-22, X(60), 62)}/>`;
    case "camel": return `<circle cx="${X(62)}" cy="56" r="12" fill="${c}" stroke="${LINE}" stroke-width="2"/><circle cx="${X(62)}" cy="56" r="6" fill="${ic}"/>`;
    case "deer": return `<ellipse cx="${X(50)}" cy="68" rx="23" ry="10" fill="${c}" stroke="${LINE}" stroke-width="2" ${rot(-26, X(50), 68)}/><ellipse cx="${X(50)}" cy="68" rx="14" ry="5" fill="${ic}" ${rot(-26, X(50), 68)}/>`;
    default: return "";
  }
}

function tailSVG(a) {
  const [t, c, c2] = a.tail || ["none"];
  const k = a.bigTail ? 1.35 : 1;
  switch (t) {
    case "puff": return `<circle cx="146" cy="176" r="11" fill="${c}" stroke="${LINE}" stroke-width="2"/>`;
    case "bushy": return `<g transform="rotate(38 140 174)"><ellipse cx="146" cy="150" rx="${13 * k}" ry="${30 * k}" fill="${c}" stroke="${LINE}" stroke-width="2"/><ellipse cx="146" cy="${150 - 23 * k}" rx="${10.5 * k}" ry="${11 * k}" fill="${c2}"/></g>`;
    case "ring": {
      let b = "";
      [150, 136, 122].forEach(y => (b += `<ellipse cx="146" cy="${y}" rx="12.5" ry="4.5" fill="${c2}"/>`));
      return `<g transform="rotate(38 140 174)"><ellipse cx="146" cy="140" rx="14" ry="34" fill="${c}" stroke="${LINE}" stroke-width="2"/>${b}</g>`;
    }
    case "long": return `<path d="M140 174 Q182 180 172 142 Q168 124 154 130" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
    case "lion": return `<path d="M142 176 Q178 172 172 142" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="172" cy="140" r="8" fill="${c2 || c}"/>`;
    case "thick": return `<ellipse cx="156" cy="178" rx="30" ry="10" fill="${c}" stroke="${LINE}" stroke-width="2" transform="rotate(-24 156 178)"/>`;
    case "feather": return `<ellipse cx="136" cy="188" rx="8" ry="28" fill="${c}" transform="rotate(-48 136 188)"/><ellipse cx="128" cy="190" rx="8" ry="28" fill="${c2}" transform="rotate(-22 128 190)"/>`;
    default: return "";
  }
}

function headSVG(a, st, id) {
  const hc = a.hc || a.c, hw = a.hw || 48, hh = a.hh || 44, cy = 96;
  const ny = a.ny || 108, ey = a.ey || 100;
  const eyeR = st === 1 ? 8.5 : 7.5;
  const [et, ec, ei] = a.ears || ["none"];
  let s = "";
  if (a.mane) {
    for (let i = 0; i < 12; i++) {
      const t = (i / 12) * Math.PI * 2;
      s += `<circle cx="${(100 + Math.cos(t) * 50).toFixed(1)}" cy="${(cy + 4 + Math.sin(t) * 48).toFixed(1)}" r="17" fill="${a.mane}"/>`;
    }
    s += `<circle cx="100" cy="${cy + 4}" r="52" fill="${a.mane}"/>`;
  }
  if (et !== "none") s += earSVG(et, ec, ei, -1) + earSVG(et, ec, ei, 1);
  s += `<clipPath id="h${id}"><ellipse cx="100" cy="${cy}" rx="${hw}" ry="${hh}"/></clipPath>`;
  s += `<ellipse cx="100" cy="${cy}" rx="${hw}" ry="${hh}" fill="${hc}" stroke="${LINE}" stroke-width="2.5"/>`;
  s += `<g clip-path="url(#h${id})">`;
  if (a.lower) s += `<path d="M50 100 Q56 142 100 142 Q144 142 150 100 Q126 116 100 114 Q74 116 50 100Z" fill="${a.lower}"/>`;
  if (a.stripes) {
    const [kind, sc] = a.stripes;
    if (kind === "tiger") s += `<g stroke="${sc}" stroke-width="5" stroke-linecap="round" fill="none"><path d="M100 50 V68 M86 52 L89 66 M114 52 L111 66"/><path d="M50 96 L64 98 M50 108 L64 106 M150 96 L136 98 M150 108 L136 106"/></g>`;
    else s += `<g stroke="${sc}" stroke-width="6" stroke-linecap="round" fill="none"><path d="M100 48 V70 M84 50 L88 74 M116 50 L112 74 M68 58 L76 80 M132 58 L124 80 M52 80 L64 94 M148 80 L136 94"/></g>`;
  }
  if (a.cap) s += `<path d="M46 92 Q48 46 100 46 Q152 46 154 92 Q136 74 118 86 Q100 66 82 86 Q64 74 46 92Z" fill="${a.cap}"/>`;
  if (a.spotsHead) s += `<g fill="${a.spotsHead}"><circle cx="68" cy="70" r="7"/><circle cx="130" cy="66" r="8"/><circle cx="108" cy="58" r="5"/></g>`;
  s += `</g>`;
  if (a.face) {
    const [kind, fc] = a.face;
    if (kind === "heart") s += `<path d="M100 82 Q86 68 70 80 Q52 96 68 118 Q84 134 100 138 Q116 134 132 118 Q148 96 130 80 Q114 68 100 82Z" fill="${fc}"/>`;
    else s += `<ellipse cx="100" cy="112" rx="34" ry="26" fill="${fc}"/><circle cx="78" cy="98" r="19" fill="${fc}"/><circle cx="122" cy="98" r="19" fill="${fc}"/>`;
  }
  if (a.muz) s += `<ellipse cx="100" cy="${a.muz[3]}" rx="${a.muz[1]}" ry="${a.muz[2]}" fill="${a.muz[0]}"/>`;
  if (a.patch) [76, 124].forEach((x, i) => (s += `<ellipse cx="${x}" cy="${ey - 2}" rx="13" ry="16" fill="${a.patch}" transform="rotate(${i ? -25 : 25} ${x} ${ey})"/>`));
  if (a.mask) s += `<path d="M50 92 Q76 80 100 92 Q124 80 150 92 Q148 114 124 114 Q108 112 100 102 Q92 112 76 114 Q52 114 50 92Z" fill="${a.mask}"/><path d="M62 82 Q76 74 90 82 M110 82 Q124 74 138 82" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  const eye = x => a.eyes === "owl"
    ? `<g class="blink"><circle cx="${x}" cy="${ey}" r="17" fill="#fff" stroke="${shade(a.c, -60)}" stroke-width="3"/><circle cx="${x}" cy="${ey}" r="9" fill="${INK}"/><circle cx="${x + 3}" cy="${ey - 4}" r="3.2" fill="#fff"/></g>`
    : `<g class="blink"><ellipse cx="${x}" cy="${ey}" rx="${eyeR}" ry="${eyeR + 1.5}" fill="${INK}"/><circle cx="${x + 2.6}" cy="${ey - 3.5}" r="2.9" fill="#fff"/><circle cx="${x - 2.2}" cy="${ey + 3.6}" r="1.4" fill="#fff"/></g>`;

function backSVG(a) {

    const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + at;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur);
  } catch (e) { /* 浏览器不支持音频时静默 */ }
}
const sfx = {
  ok() { tone(660, 0, 0.12); tone(880, 0.1, 0.2); },
  bad() { tone(220, 0, 0.18, "square", 0.07); tone(170, 0.14, 0.25, "square", 0.07); },
  up() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * 0.12, 0.3, "triangle", 0.16)); },
  tap() { tone(420 + Math.random() * 300, 0, 0.09, "triangle", 0.12); },
};
function speak(text) {
  if (S.mute || !canSpeak()) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) { /* 忽略 */ }
}
function confetti(n = 60) {
  const w = document.createElement("div");
  w.className = "confetti";
  const bits = ["🎉", "⭐", "✨", "🌟", "💖", "🎊"];
  for (let i = 0; i < n; i++) {
    const e = document.createElement("i");
    e.textContent = pick(bits);
    e.style.cssText = `left:${Math.random() * 100}%;font-size:${14 + Math.random() * 18}px;animation-duration:${2 + Math.random() * 2}s;animation-delay:${Math.random() * 0.8}s`;
    w.appendChild(e);
  }
  document.body.appendChild(w);
  setTimeout(() => w.remove(), 4800);
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3100);
}

/* ---------- 界面 ---------- */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const ui = { screen: "home", sel: null, quiz: null, evo: null, say: "", eggTaps: 0 };

const LINES = {
  idle: ["今天也要一起变强哦！", "我肚子里装满了知识～", "来做个任务吧！", "你好呀，小主人！", "我会越来越厉害的！"],
  poke: ["哈哈，好痒！", "嘿嘿～再来一下！", "我在这里！", "抱抱我！", "咕噜咕噜～"],
  ok: ["太棒啦！", "答对了，好厉害！", "你真聪明！", "耶！继续冲！"],
  bad: ["没关系，下次一定行！", "看看正确答案，记住它！", "加油，我相信你！"],
  egg: ["蛋里面好像有动静……", "咚咚咚，里面有谁在敲门？", "蛋蛋在轻轻抖动～", "它好像很想出来！"],
};

function petBlock(a, p, big) {
  const st = stageOf(p.xp), pr = progressOf(p.xp);
  return `<div class="pet ${p.shiny ? "shiny" : ""}" data-act="poke" role="button" aria-label="点一点小动物">${drawAnimal(a, st, { idx: ANIMALS.indexOf(a), pct: pr.pct, shiny: p.shiny })}</div><div class="shadow"></div>`;
}
function topBar(extra = "") {
  return `<div class="top"><div class="logo">🦁 动物园进化</div><div class="chips">${extra}<button class="chip" data-act="mute" aria-label="声音开关">${S.mute ? "🔇" : "🔊"}</button></div></div>`;
}

function homeView() {
  const a = AMAP[S.cur], p = S.pets[S.cur], pr = progressOf(p.xp);
  const st = pr.stage;
  const title = st === 0 ? "神秘的蛋" : st === 4 ? `${a.legend}` : a.n;
  const tag = st === 0 ? STAGE[0] : `Lv.${st} ${STAGE[st]}`;
  const info = st >= 4 ? "已进化到最高级，你是动物园传说！" : `${st === 0 ? "孵化" : "进化为「" + pr.next + "」"}还差 ${pr.need} 经验`;
  const say = ui.say || (st === 0 ? "（蛋蛋静静地躺着……多戳戳它试试？）" : pick(LINES.idle));
  const d = S.daily;
  return `<div class="wrap">${topBar(`<span class="chip">⭐ ${p.xp}</span>`)}
<div class="scene"><div class="bubble">${esc(say)}</div>${petBlock(a, p)}
<div class="name">${esc(title)}<span class="tag">${tag}</span></div>
<div class="bar"><i style="width:${Math.round(pr.pct * 100)}%"></i></div><div class="barinfo">${info}</div></div>
<div class="daily">📅 今日任务：答对 10 题 <div class="mini"><i style="width:${Math.min(100, d.n * 10)}%"></i></div> ${d.done ? "✅" : `${Math.min(d.n, 10)}/10`}</div>
<div class="acts"><button class="btn b-en" data-act="start" data-cat="en">🔤 英语任务<small>单词 · 听力 · 句子</small></button>
<button class="btn b-math" data-act="start" data-cat="math">🔢 数学任务<small>计算 · 应用题</small></button>
<button class="btn b-mix" data-act="start" data-cat="mix">🎲 混合挑战<small>英语和数学一起来</small></button></div>
<div class="links"><button class="btn b-ghost" data-act="pickpage">🐾 领养新伙伴</button><button class="btn b-ghost" data-act="dex">📖 图鉴与徽章</button></div></div>`;
}

function pickView() {
  const sel = ui.sel, a = sel && AMAP[sel];
  const cells = ANIMALS.map(x => `<button class="cell ${sel === x.id ? "on" : ""}" data-act="sel" data-id="${x.id}">${S.pets[x.id] ? '<span class="star">✅</span>' : ""}${drawAnimal(x, 1)}<b>${x.n}</b></button>`).join("");
  const owned = a && S.pets[a.id];
  return `<div class="wrap">${topBar(S.cur ? `<button class="chip" data-act="home">← 返回</button>` : "")}
<div class="h2">选一只小动物吧！</div><p class="hint">共 30 种。它现在还是一颗神秘的蛋，做任务就能孵化、进化，最后变成传说神兽。</p>
<div class="grid">${cells}</div>
<div class="sticky"><button class="btn b-ok" data-act="adopt" ${a ? "" : "disabled"} style="${a ? "" : "opacity:.5"}">${a ? (owned ? `去找${a.n}玩` : `领养${a.n}！`) : "先点一只喜欢的动物"}</button></div></div>`;
}

function dexView() {
  const cells = ANIMALS.map(x => {
    const p = S.pets[x.id];
    if (!p) return `<button class="cell lock" data-act="sel2" data-id="${x.id}">${drawAnimal(x, 1)}<b>？？？</b><em>未领养</em></button>`;
    const st = stageOf(p.xp);
    return `<button class="cell ${S.cur === x.id ? "on" : ""}" data-act="switch" data-id="${x.id}"><span class="star">${"★".repeat(st)}</span><div class="${p.shiny ? "shinyc" : ""}" style="${p.shiny ? "filter:hue-rotate(150deg) saturate(1.25)" : ""}">${drawAnimal(x, st, { idx: ANIMALS.indexOf(x), pct: 0, shiny: p.shiny })}</div><b>${st === 0 ? "神秘蛋" : st === 4 ? x.legend : x.n}</b><em>${STAGE[st]}</em></button>`;
  }).join("");
  const bs = BADGES.map(b => `<div class="bd ${S.badges.includes(b.id) ? "" : "off"}"><span>${b.e}</span><div><b>${b.n}</b><i>${b.d}</i></div></div>`).join("");
  const n = Object.keys(S.pets).length, legends = Object.values(S.pets).filter(p => stageOf(p.xp) >= 4).length;
  return `<div class="wrap">${topBar(`<button class="chip" data-act="home">← 返回</button>`)}
<div class="h2">📖 动物图鉴</div><p class="hint">已领养 ${n}/30 · 传说神兽 ${legends} 只 · 累计答对 ${S.stats.correct} 题</p>
<div class="grid">${cells}</div><div class="h2" style="margin-top:20px">🏅 徽章</div><div class="badges">${bs}</div></div>`;
}

function quizView() {
  const q = ui.quiz, Q = q.q, a = AMAP[S.cur], p = S.pets[S.cur];
  const dots = Array.from({ length: q.total }, (_, i) => `<i class="${q.res[i] === 1 ? "ok" : q.res[i] === 0 ? "bad" : i === q.i ? "now" : ""}"></i>`).join("");
  const spk = Q.speak ? `<button class="spk" data-act="speak" data-w="${esc(Q.speak)}">🔊 听发音</button>` : "";
  const body = Q.spell ? `<div class="qtext spell">${esc(Q.prompt)}</div>` : `<div class="qtext ${Q.small ? "s" : ""}">${esc(Q.prompt)}</div>`;
  const hint = Q.hint ? `<div class="hint" style="margin:4px 0 0">${esc(Q.hint)}</div>` : "";
  let inputs;
  if (Q.kind === "input") inputs = `<div class="inp"><input id="ans" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="输入答案" ${q.answered ? "disabled" : ""} value="${esc(q.picked ?? "")}"><button class="btn b-ok" data-act="submit" ${q.answered ? "disabled" : ""}>确定</button></div>`;
  else inputs = `<div class="opts ${Q.three ? "three" : ""}">${Q.opts.map(o => {
    const cls = q.answered ? (o === Q.ans ? "ok" : o === q.picked ? "bad" : "") : "";
    return `<button class="opt ${cls}" data-act="pick" data-v="${esc(o)}" ${q.answered ? "disabled" : ""}>${esc(o)}</button>`;
  }).join("")}</div>`;
  let fb = "";
  if (q.answered) {
    fb = q.lastOk
      ? `<div class="fb ok">✅ ${pick(LINES.ok)} +${q.lastGain} 经验<p>${esc(Q.explain)}</p></div>`
      : `<div class="fb bad">💡 ${pick(LINES.bad)}<p>正确答案：<b>${esc(Q.ans)}</b>　${esc(Q.explain)}</p></div>`;
    fb += `<button class="btn b-mix" style="margin-top:12px" data-act="next">${q.i + 1 >= q.total ? "看成绩 🎉" : "下一题 →"}</button>`;
  }
  const react = q.answered ? (q.lastOk ? "jump" : "shake") : "";
  return `<div class="wrap"><div class="qtop"><button class="x" data-act="quit" aria-label="退出">✕</button><div class="dots">${dots}</div><div class="combo">${q.combo >= 2 ? "🔥×" + q.combo : ""}</div></div>
<div class="qcard"><span class="qtag ${Q.cat === "math" ? "m" : ""}">${Q.tag}</span>${Q.emoji ? `<div class="qemoji">${Q.emoji}</div>` : ""}${body}${hint}${spk}</div>
${inputs}${fb}<div class="qpet ${p.shiny ? "shiny" : ""} ${react}"><div class="pet ${react}" style="width:100%;margin:0" data-act="poke2">${drawAnimal(a, stageOf(p.xp), { idx: ANIMALS.indexOf(a), pct: progressOf(p.xp).pct, shiny: p.shiny })}</div></div></div>`;
}

function resultView() {
  const r = ui.result;
  const stars = r.correct >= 5 ? "⭐⭐⭐" : r.correct >= 3 ? "⭐⭐" : r.correct >= 1 ? "⭐" : "💪";
  return `<div class="wrap res"><div class="big">${stars}</div><div class="score">答对 ${r.correct} / ${r.total}</div>
<div class="rows"><div>答题经验<b>+${r.xp}</b></div><div>完成奖励${r.correct >= 3 ? "" : "（答对 3 题以上才有）"}<b>+${r.bonus}</b></div>${r.dailyBonus ? `<div>📅 每日任务达成<b>+${r.dailyBonus}</b></div>` : ""}<div>最高连击<b>${r.best}</b></div></div>
<div class="acts"><button class="btn b-ok" data-act="start" data-cat="${r.cat}">再来一轮</button><button class="btn b-ghost" data-act="home">回到小窝</button></div></div>`;
}

function evoView() {
  const e = ui.evo, a = AMAP[e.id], p = S.pets[e.id];
  const legend = e.to === 4;
  const sub = e.to === 1 ? `${a.n}宝宝破壳而出啦！` : e.to === 2 ? "进化成了活力少年！" : e.to === 3 ? "进化成了闪耀的成年形态！" : `觉醒为传说神兽！`;
  return `<div class="overlay"><div class="evo"><div class="t">${e.to === 1 ? "🥚 蛋裂开啦！" : "✨ 进化成功！"}</div>
<div class="pet ${p.shiny ? "shiny" : ""}" style="margin-bottom:0">${drawAnimal(a, e.to, { idx: ANIMALS.indexOf(a), shiny: p.shiny })}</div><div class="shadow"></div>
${legend ? `<div class="legend">${a.legend}</div>` : `<div class="t" style="margin-top:8px">${a.n}</div>`}
<div class="s">${sub}${e.shiny ? "<br>🌟 哇！它是闪光色的，特别稀有！" : ""}${legend ? "<br>你太了不起了，传说中的神兽就是你养大的！" : ""}</div>
<button class="btn b-ok" data-act="evoclose">太棒了！</button></div></div>`;
}

function render() {
  const views = { home: homeView, pick: pickView, dex: dexView, quiz: quizView, result: resultView };
  document.getElementById("app").innerHTML = views[ui.screen]() + (ui.evo ? evoView() : "");
  if (ui.screen === "quiz") {
    const q = ui.quiz;
    const inp = document.getElementById("ans");
    if (inp && !q.answered) inp.focus();
    if (q.q.auto && !q.answered && !q.spoken) { q.spoken = true; setTimeout(() => speak(q.q.speak), 250); }
  }
}

/* ---------- 逻辑 ---------- */
function checkBadges() {
  BADGES.filter(b => !S.badges.includes(b.id) && b.ok(S)).forEach(b => {
    setS({ badges: [...S.badges, b.id] });
    toast(`${b.e} 获得徽章：${b.n}`);
  });
}
function openEvo(id, from, to, shiny) {
  ui.evo = { id, from, to, shiny: !!shiny };
  sfx.up(); confetti(to === 4 ? 120 : 70);
}
function startQuiz(cat) {
  if (!S.cur) return;
  const t = Math.max(1, stageOf(S.pets[S.cur].xp));
  ui.quiz = { cat, tier: t, i: 0, total: 5, res: [], correct: 0, xp: 0, combo: 0, best: 0, q: makeQ(cat, t), answered: false, picked: null, startXp: S.pets[S.cur].xp, dailyBonus: 0 };
  ui.screen = "quiz"; render();
}
function choose(v) {
  const q = ui.quiz;
  if (!q || q.answered) return;
  const ok = String(v).trim() === q.q.ans;
  const combo = ok ? q.combo + 1 : 0;
  const gain = ok ? 10 + (combo >= 3 && combo % 3 === 0 ? 5 : 0) : 0;
  const pet = S.pets[S.cur];
  addStats({ total: 1, correct: ok ? 1 : 0, en: ok && q.q.cat === "en" ? 1 : 0, math: ok && q.q.cat === "math" ? 1 : 0, best: Math.max(0, combo - S.stats.best) });
  if (ok) {
    setPet(S.cur, { xp: pet.xp + gain });
    const d = { ...S.daily, n: S.daily.n + 1 };
    if (d.n >= 10 && !d.done) { d.done = true; q.dailyBonus = 30; setPet(S.cur, { xp: S.pets[S.cur].xp + 30 }); addStats({ dailyDone: 1 }); toast("📅 每日任务完成！奖励 30 经验"); }
    setS({ daily: d });
  } else setS({ daily: { ...S.daily, d: today() } });
  sfx[ok ? "ok" : "bad"]();
  if (q.q.speakAfter) setTimeout(() => speak(q.q.speakAfter), 300);
  ui.quiz = { ...q, answered: true, picked: v, lastOk: ok, lastGain: gain, combo, best: Math.max(q.best, combo), correct: q.correct + (ok ? 1 : 0), xp: q.xp + gain, res: [...q.res, ok ? 1 : 0] };
  checkBadges();
  render();
}
function nextQ() {
  const q = ui.quiz;
  if (q.i + 1 >= q.total) return finishQuiz();
  ui.quiz = { ...q, i: q.i + 1, q: makeQ(q.cat, q.tier), answered: false, picked: null, spoken: false };
  render();
}
function finishQuiz() {
  const q = ui.quiz, id = S.cur;
  const bonus = q.correct >= 3 ? 10 : 0;
  if (bonus) setPet(id, { xp: S.pets[id].xp + bonus });
  ui.result = { cat: q.cat, correct: q.correct, total: q.total, xp: q.xp, bonus, dailyBonus: q.dailyBonus, best: q.best };
  const from = stageOf(q.startXp), to = stageOf(S.pets[id].xp);
  ui.screen = "result"; ui.say = "";
  if (to > from) openEvo(id, from, to, false);
  checkBadges(); render();
}
function poke() {
  const id = S.cur, p = S.pets[id], st = stageOf(p.xp);
  const el = document.querySelector(".scene .pet");
  const bub = document.querySelector(".bubble");
  sfx.tap();
  if (st === 0) {
    ui.eggTaps += 1;
    if (el) { el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); }
    if (ui.eggTaps >= 7) {
      ui.eggTaps = 0;
      addStats({ shiny: 1 });
      setPet(id, { xp: Math.max(p.xp, LV[1]), shiny: true });
      openEvo(id, 0, 1, true); checkBadges(); render(); return;
    }
    if (bub) bub.textContent = ui.eggTaps >= 4 ? "咔……咔嚓？好像要出来了！" : pick(LINES.egg);
    return;
  }
  addStats({ pokes: 1 });
  if (el) { el.classList.remove("jump"); void el.offsetWidth; el.classList.add("jump"); }
  if (S.stats.pokes === 10) { confetti(50); if (bub) bub.textContent = "🎉 你发现了隐藏彩蛋：戳戳达人！"; checkBadges(); return; }
  if (bub) bub.textContent = pick(LINES.poke);
}

const H = {
  mute() { setS({ mute: !S.mute }); render(); },
  home() { ui.screen = "home"; ui.say = ""; render(); },
  pickpage() { ui.screen = "pick"; ui.sel = null; render(); },
  dex() { ui.screen = "dex"; render(); },
  sel(d) { ui.sel = d.id; render(); },
  sel2(d) { ui.screen = "pick"; ui.sel = d.id; render(); },
  adopt() {
    const id = ui.sel; if (!id) return;
    if (!S.pets[id]) { setS({ pets: { ...S.pets, [id]: { xp: 0, shiny: false } } }); toast("🥚 你得到了一颗神秘的蛋！"); }
    setS({ cur: id }); ui.eggTaps = 0; ui.screen = "home"; ui.say = ""; checkBadges(); sfx.ok(); render();
  },
  switch(d) { setS({ cur: d.id }); ui.screen = "home"; ui.say = ""; ui.eggTaps = 0; render(); },
  start(d) { startQuiz(d.cat); },
  pick(d) { choose(d.v); },
  submit() { const i = document.getElementById("ans"); if (i && i.value.trim() !== "") choose(i.value); },
  next() { nextQ(); },
  speak(d) { speak(d.w); },
  quit() { if (ui.quiz && ui.quiz.res.length && !confirm("现在退出，这一轮的成绩不会算奖励哦，确定吗？")) return; ui.screen = "home"; render(); },
  evoclose() { ui.evo = null; render(); },
  poke() { poke(); },
  poke2() { sfx.tap(); },
};

function init() {
  const app = document.getElementById("app");
  app.addEventListener("click", e => {
    const t = e.target.closest("[data-act]");
    if (!t || !app.contains(t)) return;
    const f = H[t.dataset.act];
    if (f && !t.disabled) f(t.dataset, t);
  });
  app.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "ans") H.submit(); });
  ui.screen = S.cur && S.pets[S.cur] ? "home" : "pick";
  render();
}

if (typeof globalThis !== "undefined") globalThis.Zoo = { ANIMALS, AMAP, drawAnimal, mathQ, enQ, makeQ, WORDS, SENT, stageOf, progressOf, LV };
if (typeof document !== "undefined" && document.getElementById("app")) init();
</script>
