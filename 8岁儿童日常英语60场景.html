<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="8 岁儿童日常英语 60 场景：每天一课、按记忆曲线复习、朗读跟读、小测与奖章。">
<style>
  html{-webkit-text-size-adjust:100%}
  body{margin:0;padding:0;font:14px system-ui}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>60 天英语脱口秀</title>
<style>
:root{
  --bg:#FFFFFF; --bg2:#F5F5F7; --surface:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73;
  --line:#E3E3E6; --hair:#D2D2D7; --blue:#0071E3; --blue-soft:#EAF3FE;
  --green:#30A46C; --amber:#B25E09; --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg2:#0B0B0D; --surface:#151517; --ink:#F5F5F7; --muted:#98989D;
    --line:#2A2A2D; --hair:#3A3A3D; --blue:#0A84FF; --blue-soft:#12243A;
    --green:#3ECF8E; --amber:#E7A33E;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#0B0B0D; --surface:#151517; --ink:#F5F5F7; --muted:#98989D;
  --line:#2A2A2D; --hair:#3A3A3D; --blue:#0A84FF; --blue-soft:#12243A;
  --green:#3ECF8E; --amber:#E7A33E;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;
}
h1,h2,h3{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","PingFang SC",sans-serif;
  font-weight:600;letter-spacing:-0.022em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px}
.wrap{max-width:760px;margin:0 auto;padding:0 22px 120px}
svg.spk{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}

/* header */
header.top{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-in{max-width:760px;margin:0 auto;padding:11px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:17px;font-weight:600}
.brand p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;gap:14px;align-items:center;flex:none}
.hud .pill{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hud .pill b{color:var(--ink);font-weight:600}
.iconbtn{background:none;border:none;padding:4px;color:var(--muted);line-height:0}
.iconbtn:hover{color:var(--ink)}

/* tabs */
nav.tabs{position:sticky;top:47px;z-index:29;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:760px;margin:0 auto;padding:0 22px;display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{background:none;border:none;padding:12px 0;font-size:14px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:590;border-bottom-color:var(--ink)}

section.view{display:flex;flex-direction:column;gap:14px;padding-top:34px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.h-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.hr{height:1px;background:var(--line);border:0;margin:18px 0}

/* hero */
.daycard{padding:6px 2px 26px;border-bottom:1px solid var(--line)}
.daynum{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.daycard h2{margin:10px 0 2px;font-size:44px;line-height:1.08;font-weight:600}
.daycard .en{font-size:19px;color:var(--muted);margin:0;font-weight:400}
.progressbar{height:4px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-top:26px}
.progressbar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.step{font-size:13px;color:var(--muted);background:var(--bg2);border-radius:999px;padding:5px 12px}

/* sentences */
ul.sents{list-style:none;margin:0;padding:0}
li.sent{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
li.sent:first-child{border-top:0}
li.sent.key .e{font-weight:590}
.sent .txt{flex:1;min-width:0}
.sent .e{font-size:17px;line-height:1.45;word-wrap:break-word}
.sent .z{font-size:14px;color:var(--muted);margin-top:1px}
.say{border:none;background:none;padding:6px 0 0;color:var(--muted);flex:none;line-height:0}
.say:hover{color:var(--blue)}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-top:15px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg2);border:none;border-radius:999px;padding:6px 13px;font-size:14px;color:var(--ink)}
.chip.word{cursor:pointer}
.chip.word:hover{background:var(--blue);color:#fff}

blockquote.ex{margin:0;padding:0}
blockquote.ex p{margin:0}
blockquote.ex .en{font-size:19px;line-height:1.5}
blockquote.ex .z{color:var(--muted);font-size:14px;margin-top:8px}

.dlg{display:flex;flex-direction:column;gap:10px}
.turn{display:flex;gap:12px;align-items:flex-start}
.who{flex:none;font-size:13px;color:var(--muted);width:62px;text-align:right;padding-top:9px}
.bubble{background:var(--bg2);border-radius:16px;padding:8px 14px;font-size:16px}
.turn.child .bubble{background:var(--blue);color:#fff}

/* quiz */
.quiz .q{font-size:26px;font-weight:600;letter-spacing:-0.02em;margin:14px 0 20px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:13px 16px;font-size:16px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);color:var(--green)}
.opt.wrong{border-color:var(--amber);color:var(--amber)}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--ink)}
.dots i.miss{background:var(--amber)}

.btn{border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:10px 22px;font-size:15px;transition:.15s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.go{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.go:hover{opacity:.85;background:var(--blue);color:#fff}
.btn.ghost{border-color:var(--hair);color:var(--muted)}
.btn.ghost:hover{background:none;border-color:var(--ink);color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note{font-size:15px;color:var(--muted);border-left:2px solid var(--line);padding-left:14px}

/* scene list */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scenebtn{text-align:left;background:var(--surface);border:none;padding:14px 16px;display:flex;gap:12px;align-items:baseline}
.scenebtn:hover{background:var(--bg2)}
.scenebtn b{display:block;font-size:15px;font-weight:500}
.scenebtn span.sub{font-size:12px;color:var(--muted)}
.scenebtn .no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:20px}
.scenebtn .mark{margin-left:auto;font-size:11px;color:var(--muted);flex:none}
.scenebtn.done .mark{color:var(--green)}
.scenebtn.due .mark{color:var(--amber)}
.parthead{margin:26px 0 10px;font-size:15px;color:var(--muted);font-weight:500}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:18px 16px}
.stat b{display:block;font-size:34px;font-weight:600;letter-spacing:-0.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.badge{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;color:var(--muted)}
.badge.on{color:var(--ink);border-color:var(--ink)}
.badge em{font-style:normal;font-size:15px;width:26px;height:26px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;flex:none;font-size:12px}
.badge b{display:block;font-size:14px;font-weight:550}
.badge span{font-size:12px;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 12px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
ol.steps-list,ul.plain{margin:0;padding-left:20px}
ol.steps-list li,ul.plain li{padding:5px 0}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:15px;
  opacity:0;transition:.22s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){
  .daycard h2{font-size:32px}.quiz .q{font-size:22px}.who{width:50px}
  body{font-size:16px}
}
</style>
</head>

an you help me zip up my jacket?","zh":"你能帮我拉上外套拉链吗？","star":false}],"examples":[{"title":"","en":"It is cold today, so I put on a sweater and a warm coat. I also wear a hat when I go outside.","zh":"今天很冷，所以我穿上毛衣和厚外套。出门时我还戴了一顶帽子。"}],"dialogs":[{"title":"迷你对话","lines":[{"who":"Dad","line":"What are you wearing today?"},{"who":"Child","line":"I'm wearing my school uniform."},{"who":"Dad","line":"It's cold outside. Put on your coat."},{"who":"Child","line":"Okay. Can you help me find it?"}]}],"swaps":[{"pattern":"I'm wearing a ___ and ___.","options":"T-shirt / shirt / sweater / jacket；pants / shorts / skirt / jeans"}],"patterns":[],"keywords":["shirt","jacket","getting","dressed","school","uniform","wearing","blue"]},{"id":3,"part":"早晨与个人生活","zh":"刷牙","en":"Brush My Teeth","sentences":[{"en":"I brush my teeth twice a day.","zh":"我每天刷两次牙。","star":true},{"en":"I brushed my teeth and washed my face.","zh":"我刷了牙，也洗了脸。","star":true},{"en":"I put some toothpaste on my toothbrush.","zh":"我在牙刷上挤了一些牙膏。","star":false},{"en":"Brush every tooth carefully.","zh":"仔细刷每一颗牙。","star":false},{"en":"I rinse my mouth with water.","zh":"我用水漱口。","star":false},{"en":"Don't use too much toothpaste.","zh":"不要用太多牙膏。","star":false},{"en":"My mouth feels fresh and clean.","zh":"我的嘴巴感觉清新又干净。","star":false}],"examples":[{"title":"","en":"First, I put toothpaste on my toothbrush. Then I brushed my teeth for two minutes. Finally, I rinsed my mouth and cleaned my toothbrush.","zh":"首先，我在牙刷上挤牙膏。然后我刷了两分钟牙。最后，我漱了口并洗干净牙刷。"}],"dialogs":[{"title":"迷你对话","lines":[{"who":"Mom","line":"Did you brush your teeth?"},{"who":"Child","line":"Not yet. I'm doing it now."},{"who":"Mom","line":"Remember to brush for two minutes."},{"who":"Child","line":"Okay. My teeth will be nice and clean."}]}],"swaps":[],"patterns":[],"keywords":["brush","teeth","toothpaste","mouth","twice","day","brushed","washed"]},{"id":4,"part":"早晨与个人生活","zh":"洗脸与洗手","en":"Washing My Face and Hands","sentences":[{"en":"I wash my face every morning.","zh":"我每天早上洗脸。","star":true},{"en":"Wash your hands with soap.","zh":"用肥皂洗手。","star":true},{"en":"My hands are dirty.","zh":"我的手脏了。","star":false},{"en":"My hands are clean now.","zh":"我的手现在干净了。","star":false},{"en":"The water is too cold.","zh":"水太凉了。","star":false},{"en":"Please pass me the towel.","zh":"请把毛巾递给我。","star":false},{"en":"Dry your hands with a towel.","zh":"用毛巾擦干手。","star":false},{"en":"Don't forget to wash between your fingers.","zh":"别忘了洗指缝。","star":false}],"examples":[{"title":"","en":"I washed my hands with soap after playing outside. I cleaned my palms, my fingers, and the backs of my hands. Then I dried them with a towel.","zh":"我在外面玩后用肥皂洗了手。我洗了手掌、手指和手背，然后用毛巾擦干。"}],"dialogs":[{"title":"迷你对话","lines":[{"who":"Dad","line":"Dinner is ready."},{"who":"Child","line":"Great! I'm hungry."},{"who":"Dad","line":"Your hands are dirty. Please wash them first."},{"who":"Child","line":"Okay. I'll wash them with soap."}]}],"swaps":[],"patterns":[],"keywords":["hands","wash","towel","face","every","morning","soap","dirty"]},{"id":5,"part":"早晨与个人生活","zh":"洗澡","en":"Taking a Shower","sentences":[{"en":"I'm going to take a shower.","zh":"我要去洗澡了。","star":true},{"en":"I took a shower before bed.","zh":"我睡前洗了澡。","star":false},{"en":"I washed my hair with shampoo.","zh":"我用洗发水洗了头。","star":false},{"en":"The water is too hot.","zh":"水太热了。","star":false},{"en":"Could you make the water a little cooler?","zh":"能把水调凉一点吗？","star":false},{"en":"Be careful. The floor is slippery.","zh":"小心，地板很滑。","star":false},{"en":"I need a clean towel.","zh":"我需要一条干净的毛巾。","star":false},{"en":"I feel clean and fresh now.","zh":"我现在感觉干净又清爽。","star":false}],"examples":[],"dialogs":[{"title":"迷你对话","lines":[{"who":"Mom","line":"It's time for a shower."},{"who":"Child","line":"Can I finish this page first?"},{"who":"Mom","line":"Sure. Then take your pajamas with you."},{"who":"Child","line":"Okay. I'll be ready in two minutes."}]}],"swaps":[],"patterns":[],"keywords":["shower","water","cl ":"你想和我一起玩吗？","star":false},{"en":"What would you like for dinner?","zh":"你晚饭想吃什么？","star":false}],"examples":[],"dialogs":[{"title":"迷你对话","lines":[{"who":"Dad","line":"What would you like for breakfast?"},{"who":"Child","line":"I'd like an egg and some bread."},{"who":"Dad","line":"Would you like some milk?"},{"who":"Child","line":"Yes, please."}]}],"swaps":[],"patterns":[],"keywords":["want","i'd","water","home","rice","another","try","myself"]},{"id":52,"part":"把句子连起来的表达工具","zh":"表达计划","en":"Plans","sentences":[{"en":"What are you going to do today?","zh":"你今天打算做什么？","star":true},{"en":"I'm going to read tonight.","zh":"我今晚打算看书。","star":false},{"en":"We're going to the zoo tomorrow.","zh":"我们明天要去动物园。","star":false},{"en":"I plan to finish my homework first.","zh":"我计划先完成作业。","star":false},{"en":"After that, I'm going to play outside.","zh":"之后我打算去外面玩。","star":false},{"en":"Are you going to join us?","zh":"你打算和我们一起吗？","star":false},{"en":"I'm not sure yet.","zh":"我还不确定。","star":false},{"en":"That sounds like a good plan.","zh":"听起来是个好计划。","star":false}],"examples":[],"dialogs":[{"title":"迷你对话","lines":[{"who":"Mom","line":"What are you going to do after school?"},{"who":"Child","line":"I'm going to finish my homework first."},{"who":"Mom","line":"What will you do after that?"},{"who":"Child","line":"I'm going to ride my bike in the park."}]}],"swaps":[],"patterns":[],"keywords":["plan","today","read","tonight","zoo","tomorrow","finish","homework"]},{"id":53,"part":"把句子连起来的表达工具","zh":"表达原因","en":"Giving Reasons","sentences":[{"en":"I'm tired because I didn't sleep well.","zh":"我很累，因为昨晚没睡好。","star":false},{"en":"I'm happy because I got a new book.","zh":"我很开心，因为得到了一本新书。","star":false},{"en":"I stayed home because it was raining.","zh":"因为下雨，所以我待在家里。","star":false},{"en":"I like PE because I enjoy running.","zh":"我喜欢体育课，因为我喜欢跑步。","star":false},{"en":"I was late because the bus came late.","zh":"我迟到了，因为公交车来晚了。","star":false},{"en":"I need help because I don't underst       <h1>60 天英语脱口秀</h1>
      <p>每天一个场景，说出真实的一天</p>
    </div>
    <div class="hud">
      <span class="pill" title="累计星星"><b id="hudStars">0</b> 星</span>
      <span class="pill" title="连续打卡"><b id="hudStreak">0</b> 天</span>
      <button class="iconbtn" id="themeBtn" title="切换外观" aria-label="切换外观">
        <svg class="spk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.5 6.5 5 5M19 19l-1.5-1.5M17.5 6.5 19 5M5 19l1.5-1.5"/></svg>
      </button>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" data-view="today" aria-selected="true">今天</button>
    <button class="tab" role="tab" data-view="review" aria-selected="false">复习 <span id="dueBadge"></span></button>
    <button class="tab" role="tab" data-view="all" aria-selected="false">60 个场景</button>
    <button class="tab" role="tab" data-view="plan" aria-selected="false">计划表</button>
    <button class="tab" role="tab" data-view="me" aria-selected="false">我的奖章</button>
  </div>
</nav>

<main class="wrap">
  <section class="view" id="view-today"></section>
  <section class="view" id="view-review" hidden></section>
  <section class="view" id="view-all" hidden></section>
  <section class="view" id="view-plan" hidden></section>
  <section class="view" id="view-me" hidden></section>
</main>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const SPK = '<svg class="spk" viewBox="0 0 24 24"><path d="M4 9.5h3.6L12 5.6v12.8L7.6 14.5H4z"/><path d="M15.8 9.2a4 4 0 0 1 0 5.6"/><path d="M18.4 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>';
const SCENES = window.__SCENES__;
const PATTERNS = SCENES[59].patterns;
const WEEKS = window.__WEEKS__;
const FIVE_Q = [
  ["What did you do today?","你今天做了什么？"],
  ["What did you eat?","你吃了什么？"],
  ["What did you learn?","你学到了什么？"],
  ["How did you feel?","你感觉怎么样？"],
  ["What are you going to do tomorrow?","你明天打算做什么？"]
];
const CHEERS = ["太棒了！你说得越来越自然了。","Wow! 这些句子已经变成你的了。","坚持就是超能力，继续加油！","你今天又多了几句可以脱口而出的英语。","Great job! 明天的你会更厉害。"];
const INTERVALS = [1,2,4,7,15,30];
const BADGES = [
  {id:"d3", emoji:"3", name:"三天不断", desc:"连续打卡 3 天", test:s=>s.streak>=3},
  {id:"d7", emoji:"7", name:"一周坚持", desc:"连续打卡 7 天", test:s=>s.streak>=7},
  {id:"d14",emoji:"14", name:"两周达人", desc:"连续打卡 14 天", test:s=>s.streak>=14},
  {id:"s10",emoji:"◔", name:"小小开口", desc:"学完 10 个场景", test:s=>s.done>=10},
  {id:"s30",emoji:"◑", name:"半程英雄", desc:"学完 30 个场景", test:s=>s.done>=30},
  {id:"s60",emoji:"●", name:"全场景通关", desc:"学完 60 个场景", test:s=>s.done>=60},
  {id:"st50",emoji:"★", name:"五十颗星", desc:"累计 50 颗星", test:s=>s.stars>=50},
  {id:"st150",emoji:"✦", name:"星星收藏家", desc:"累计 150 颗星", test:s=>s.stars>=150},
  {id:"r20",emoji:"↻", name:"记忆大师", desc:"完成 20 次复习", test:s=>s.reviews>=20}
];

/* ---------- storage: db when available, localStorage otherwise ---------- */
const LS = "kid-english-60";
let state = {records:{}, reviews:0, lastDay:null, days:[]};
let dbDoc = null;
function loadLocal(){ try{ const r=localStorage.getItem(LS); if(r) state=Object.assign(state,JSON.parse(r)); }catch(e){} }
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  if(dbDoc){ dbDoc.set(JSON.parse(JSON.stringify(state))).catch(()=>{}); }
}
loadLocal();
(async function(){
  try{
    const db = await window.claude?.use?.("db");
    if(!db) return;
    dbDoc = db.doc("progress/main");
    const snap = await dbDoc.get();
    if(snap && snap.records && Object.keys(snap.records).length >= Object.keys(state.records).length){
      state = Object.assign(state, snap); render();
    }else{ save(); }
  }catch(e){}
})();

const today = () => new Date().toISOString().slice(0,10);
const dayNum = d => Math.floor(new Date(d+"T00:00:00").getTime()/86400000);
const addDays = (d,n) => new Date((dayNum(d)+n)*86400000).toISOString().slice(0,10);

function rec(id){ return state.records[id] || null; }
function streak(){
  const days=[...new Set(state.days||[])].sort();
  if(!days.length) return 0;
  const t=dayNum(today()); const last=dayNum(days[days.length-1]);
  if(t-last>1) return 0;
  let n=1;
  for(let i=days.length-1;i>0;i--){ if(dayNum(days[i])-dayNum(days[i-1])===1) n++; else break; }
  return n;
}
function totalStars(){ return Object.values(state.records).reduce((a,r)=>a+(r.stars||0),0); }
function doneCount(){ return Object.keys(state.records).length; }
function stats(){ return {streak:streak(), stars:totalStars(), done:doneCount(), reviews:state.reviews||0}; }
function dueList(){
  const t=today();
  return Object.keys(state.records).map(Number).filter(id=>{
    const r=state.records[id];
    return r.next && r.next<=t && r.stage < INTERVALS.length;
  }).sort((a,b)=>state.records[a].next.localeCompare(state.records[b].next));
}
function todayScene(){
  const t=today();
  const idsToday = Object.keys(state.records).filter(id=>state.records[id].learned===t).map(Number);
  if(idsToday.length) return idsToday[0];
  for(let i=1;i<=60;i++) if(!state.records[i]) return i;
  return 60;
}
function completeScene(id, stars){
  const t=today(), r=rec(id);
  state.records[id] = {learned: r?r.learned:t, stage:0, next:addDays(t,INTERVALS[0]), stars:(r?r.stars:0)+stars};
  state.days = [...new Set([...(state.days||[]), t])];
  save();
}
function completeReview(id, stars){
  const r=rec(id); if(!r) return;
  const t=today(); const stage=Math.min((r.stage||0)+1, INTERVALS.length);
  r.stage=stage; r.stars=(r.stars||0)+stars;
  r.next = stage<INTERVALS.length ? addDays(t, INTERVALS[stage]) : null;
  state.reviews=(state.reviews||0)+1;
  state.days=[...new Set([...(state.days||[]), t])];
  save();
}

/* ---------- speech ---------- */
let voice=null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  voice = vs.find(v=>/US|United States/i.test(v.lang+v.name)) || vs[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US"; u.rate=rate||0.85; if(voice) u.voice=voice;
  speechSynthesis.speak(u);
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sentenceHTML(s, key){
  return `<li class="sent${key?" key":""}"><span class="dot"${key?"":' style="background:transparent"'}></span>
    <div class="txt"><div class="e">${esc(s.en)}</div><div class="z">${esc(s.zh)}</div></div>
    <button class="say" data-say="${esc(s.en)}" aria-label="朗读">${SPK}</button></li>`;
}
function keySentences(sc){
  const st = sc.sentences.filter(s=>s.star);
  return st.length ? st : sc.sentences.slice(0,3);
}

/* ---------- quiz ---------- */
function makeQuiz(sc, n){
  const pool = sc.sentences.length>=4 ? sc.sentences : SCENES[sc.id-1].sentences;
  const picks = shuffle(keySentences(sc).concat(shuffle(sc.sentences)))
    .filter((v,i,a)=>a.findIndex(x=>x.en===v.en)===i).slice(0, Math.min(n, sc.sentences.length));
  const others = SCENES.flatMap(s=>s.sentences);
  return picks.map(p=>{
    const wrong = shuffle(others.filter(o=>o.en!==p.en && Math.abs(o.en.length-p.en.length)<26)).slice(0,3);
    return {zh:p.zh, en:p.en, opts:shuffle([p, ...wrong])};
  });
}
function quizCard(sc, mode, onDone){
  const qs = makeQuiz(sc, mode==="review"?4:5);
  let i=0, right=0;
  const card = el(`<div class="card quiz">
    <div class="h-row" style="justify-content:space-between">
      <span class="eyebrow">${mode==="review"?"复习小测 · 看中文说英文":"练一练 · 看中文选英文"}</span>
      <span class="dots"></span>
    </div>
    <div class="q"></div><div class="opts"></div>
    <div class="row" style="margin-top:14px"><span class="small muted" id="qtip">先在心里说出来，再选答案。</span></div>
  </div>`);
  const dots=card.querySelector(".dots"), qEl=card.querySelector(".q"), oEl=card.querySelector(".opts"), tip=card.querySelector("#qtip");
  dots.innerHTML = qs.map(()=>'<i></i>').join("");
  function step(){
    if(i>=qs.length){
      const stars = right>=qs.length?3 : right>=qs.length-1?2 : right>0?1:0;
      qEl.textContent = `你答对了 ${right} / ${qs.length} 题`;
      oEl.innerHTML = `<div class="note">${stars?"★".repeat(stars)+" ":""}${esc(CHEERS[Math.floor(Math.random()*CHEERS.length)])}</div>`;
      tip.textContent="";
      onDone(stars, card);
      return;
    }
    const q=qs[i];
    qEl.textContent = q.zh;
    oEl.innerHTML = q.opts.map(o=>`<button class="opt" data-en="${esc(o.en)}">${esc(o.en)}</button>`).join("");
    oEl.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const ok = b.dataset.en===q.en;
      oEl.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(x.dataset.en===q.en) x.classList.add("right"); });
      if(!ok) b.classList.add("wrong"); else right++;
      dots.children[i].className = ok?"done":"miss";
      speak(q.en);
      tip.textContent = ok?"答对啦！跟着读一遍。":"正确答案已经点亮，跟读两遍就记住了。";
      i++;
      setTimeout(step, 1400);
    }));
  }
  step();
  return card;
}

/* ---------- scene detail blocks ---------- */
function sceneBlocks(sc){
  const out=[];
  out.push(el(`<div class="card">
    <div class="eyebrow">重点句 · 先练成条件反射</div>
    <ul class="sents" style="margin-top:10px">${keySentences(sc).map(s=>sentenceHTML(s,true)).join("")}</ul>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost" data-playall="key">连续朗读重点句</button>
    </div>
  </div>`));
  out.push(el(`<div class="card">
    <div class="eyebrow">本场景高频词</div>
    <div class="chips" style="margin-top:10px">${sc.keywords.map(w=>`<button class="chip word" data-say="${esc(w)}">${esc(w)}</button>`).join("")}</div>
    <div class="eyebrow" style="margin-top:16px">全部句子（${sc.sentences.length} 句）</div>
    <ul class="sents" style="margin-top:10px">${sc.sentences.map(s=>sentenceHTML(s,s.star)).join("")}</ul>
  </div>`));
  if(sc.examples.length) out.push(el(`<div class="card">
    <div class="eyebrow">连起来说一小段</div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">
    ${sc.examples.map(e=>`<blockquote class="ex">${e.title?`<div class="eyebrow">${esc(e.title)}</div>`:""}
      <p class="en">${esc(e.en)} <button class="say" data-say="${esc(e.en)}" aria-label="朗读">${SPK}</button></p>
      <p class="z">${esc(e.zh)}</p></blockquote>`).join("")}</div>
  </div>`));
  if(sc.dialogs.length) out.push(el(`<div class="card">
    <div class="eyebrow">和爸爸妈妈演一演</div>
    ${sc.dialogs.map(d=>`<div style="margin-top:12px">${d.title?`<div class="small muted" style="font-weight:900">${esc(d.title)}</div>`:""}
      <div class="dlg" style="margin-top:8px">${d.lines.map(l=>`<div class="turn ${/child/i.test(l.who)?"child":""}">
        <div class="who">${esc(l.who)}</div>
        <button class="say" data-say="${esc(l.line)}" aria-label="朗读">${SPK}</button>
        <div class="bubble">${esc(l.line)}</div></div>`).join("")}</div></div>`).join("")}
  </div>`));
  if(sc.swaps.length) out.push(el(`<div class="card">
    <div class="eyebrow">换一个词，再说一遍</div>
    ${sc.swaps.map(s=>`<div style="margin-top:12px">
      <div class="e" style="font-size:19px;font-weight:900">${esc(s.pattern)}</div>
      ${s.options?`<div class="chips" style="margin-top:8px">${s.options.split(/[；;]/).flatMap(g=>g.split("/")).map(o=>o.trim()).filter(Boolean).map(o=>`<span class="chip">${esc(o)}</span>`).join("")}</div>`:""}
    </div>`).join("")}
  </div>`));
  if(sc.patterns.length) out.push(el(`<div class="card">
    <div class="eyebrow">40 个万能句型</div>
    <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>#</th><th>句型</th><th>例句</th><th>中文</th></tr></thead>
    <tbody>${sc.patterns.map(p=>`<tr><td>${p.n}</td><td><b>${esc(p.pat)}</b></td>
      <td>${esc(p.en)} <button class="say" data-say="${esc(p.en)}" aria-label="朗读">${SPK}</button></td>
      <td class="muted">${esc(p.zh)}</td></tr>`).join("")}</tbody></table></div>
  </div>`));
  return out;
}

/* ---------- views ---------- */
function renderToday(){
  const v=document.getElementById("view-today"); v.innerHTML="";
  const id = todayScene(), sc = SCENES[id-1], r = rec(id);
  const done = doneCount();
  const hero = el(`<div class="daycard">
    <div class="daynum">DAY ${id} / 60 · ${esc(sc.part)}</div>
    <h2>${esc(sc.zh)}</h2>
    <p class="en">${esc(sc.en)}</p>
    <div class="progressbar"><i style="width:${Math.round(done/60*100)}%"></i></div>
    <div class="row small muted" style="margin-top:8px;justify-content:space-between">
      <span>已学 ${done} / 60 个场景</span><span>约 10 分钟</span>
    </div>
    <div class="steps">
      <span class="step">1 听 · 跟读 3 遍</span><span class="step">2 遮住英文说</span>
      <span class="step">3 换词再说</span><span class="step">4 演对话</span><span class="step">5 做小测</span>
    </div>
  </div>`);
  v.appendChild(hero);
  sceneBlocks(sc).forEach(b=>v.appendChild(b));

  const quizWrap = el('<div id="todayQuiz"></div>');
  v.appendChild(quizWrap);
  quizWrap.appendChild(quizCard(sc, "learn", (stars, card)=>{
    const btn = el(`<button class="btn go" style="margin-top:14px">完成今天的打卡 · ${"★".repeat(Math.max(stars,1))}</button>`);
    btn.addEventListener("click", ()=>{
      completeScene(id, Math.max(stars,1));
      toast(`Day ${id} 打卡成功！明天复习这一课。`);
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    });
    card.appendChild(btn);
  }));

  v.appendChild(el(`<div class="card">
    <div class="eyebrow">睡前每日五问</div>
    <ul class="sents" style="margin-top:10px">${FIVE_Q.map(q=>sentenceHTML({en:q[0],zh:q[1]},false)).join("")}</ul>
  </div>`));

  if(r) v.appendChild(el(`<div class="card"><div class="note">今天的场景已经打卡（得到 ${r.stars} 星）。下一次复习：${esc(r.next||"已毕业")}。去「复习」看看有没有到期的旧场景。</div></div>`));
}

function renderReview(){
  const v=document.getElementById("view-review"); v.innerHTML="";
  const due = dueList();
  v.appendChild(el(`<div class="card">
    <div class="eyebrow">记忆曲线复习</div>
    <h2 style="margin:6px 0 4px">今天要复习 ${due.length} 个场景</h2>
    <p class="small muted" style="margin:0">每个场景在学完后的第 1、2、4、7、15、30 天各复习一次；复习通过一次，下次间隔就会变长。</p>
  </div>`));
  if(!due.length){
    v.appendChild(el(`<div class="card"><div class="note">今天没有到期的复习。可以去「今天」学新场景，或在「60 个场景」里挑一个自由练习。</div></div>`));
  }
  due.forEach(id=>{
    const sc=SCENES[id-1], r=rec(id);
    const card=el(`<div class="card">
      <div class="h-row" style="justify-content:space-between">
        <div><div class="daynum">场景 ${id} · 第 ${(r.stage||0)+1} 次复习</div>
        <h3 style="margin:2px 0 0">${esc(sc.zh)} <span class="muted" style="font-weight:700;font-size:16px">${esc(sc.en)}</span></h3></div>
        <button class="btn ghost" data-open="${id}">看课文</button>
      </div>
      <ul class="sents" style="margin-top:12px">${keySentences(sc).map(s=>sentenceHTML(s,true)).join("")}</ul>
      <div class="rq"></div>
    </div>`);
    const wrap=card.querySelector(".rq");
    const start=el('<button class="btn" style="margin-top:14px">开始复习小测</button>');
    start.addEventListener("click",()=>{
      start.remove();
      wrap.appendChild(quizCard(sc,"review",(stars,qc)=>{
        const b=el(`<button class="btn go" style="margin-top:14px">复习完成 · ${"★".repeat(Math.max(stars,1))}</button>`);
        b.addEventListener("click",()=>{ completeReview(id, Math.max(stars,1)); toast("复习完成，下次间隔变长啦！"); render(); });
        qc.appendChild(b);
      }));
    });
    wrap.appendChild(start);
    v.appendChild(card);
  });
}

function renderAll(){
  const v=document.getElementById("view-all"); v.innerHTML="";
  const due=new Set(dueList());
  let part=null;
  const head=el(`<div class="card"><div class="eyebrow">场景库</div>
    <p class="small muted" style="margin:6px 0 0">标注「已学」表示学过，「待复习」表示今天到期。点任意场景都可以自由练习。</p></div>`);
  v.appendChild(head);
  let grid=null;
  SCENES.forEach(sc=>{
    if(sc.part!==part){ part=sc.part; v.appendChild(el(`<h3 class="parthead">${esc(part)}</h3>`)); grid=el('<div class="grid"></div>'); v.appendChild(grid); }
    const cls = due.has(sc.id)?"due" : rec(sc.id)?"done":"";
    const mark = due.has(sc.id)?"待复习" : rec(sc.id)?"已学":"";
    grid.appendChild(el(`<button class="scenebtn ${cls}" data-open="${sc.id}">
      <span class="no">${String(sc.id).padStart(2,"0")}</span>
      <span style="min-width:0"><b>${esc(sc.zh)}</b><span class="sub">${esc(sc.en)}</span></span>
      <span class="mark">${mark}</span></button>`));
  });
}

function openScene(id){
  const sc=SCENES[id-1];
  const v=document.getElementById("view-all"); v.innerHTML="";
  switchTab("all");
  v.appendChild(el(`<div class="card"><button class="btn ghost" id="backAll">← 返回场景库</button></div>`));
  v.appendChild(el(`<div class="daycard"><div class="daynum">场景 ${id} · ${esc(sc.part)}</div>
    <h2>${esc(sc.zh)}</h2><p class="en">${esc(sc.en)}</p></div>`));
  sceneBlocks(sc).forEach(b=>v.appendChild(b));
  const qw=el("<div></div>"); v.appendChild(qw);
  qw.appendChild(quizCard(sc,"learn",(stars,card)=>{
    const b=el(`<button class="btn go" style="margin-top:14px">记录这次练习 · ${"★".repeat(Math.max(stars,1))}</button>`);
    b.addEventListener("click",()=>{ if(rec(id)) completeReview(id,Math.max(stars,1)); else completeScene(id,Math.max(stars,1)); toast("已记录！"); render(); });
    card.appendChild(b);
  }));
  document.getElementById("backAll").addEventListener("click",()=>{ renderAll(); window.scrollTo({top:0}); });
  window.scrollTo({top:0});
}

function renderPlan(){
  const v=document.getElementById("view-plan"); v.innerHTML="";
  v.appendChild(el(`<div class="card"><div class="eyebrow">怎么用这份材料</div>
    <h2 style="margin:6px 0 8px">每天 10 分钟，5 个步骤</h2>
    <ol class="steps-list small" style="margin:8px 0 0">
      <li><b>听和跟读</b>：家长读一句，孩子跟读一句，重复 3 遍。</li>
      <li><b>看中文说英文</b>：遮住英文，根据中文说出句子。</li>
      <li><b>替换关键词</b>：把时间、人物、食物、地点换成今天的真实情况。</li>
      <li><b>角色对话</b>：和家长交换角色，把迷你对话说 2 遍。</li>
      <li><b>当天复述</b>：晚上挑 5～10 句，连起来说说自己的一天。</li>
    </ol></div>`));
  v.appendChild(el(`<div class="card"><div class="eyebrow">记忆曲线安排</div>
    <p class="small" style="margin:8px 0 0">学完一个场景后，会在 <b>第 1、2、4、7、15、30 天</b> 自动排入复习。到期的场景会出现在「复习」页，并标注「待复习」。六次复习都通过，这个场景就算真正学会了。</p></div>`));
  const rows = WEEKS.map(w=>`<tr><td><b>${esc(w[0])}</b></td><td>${esc(w[1])}</td><td class="muted">${esc(w[2])}</td></tr>`).join("");
  v.appendChild(el(`<div class="card"><div class="eyebrow">12 周口语任务</div>
    <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>周数</th><th>场景</th><th>口语任务</th></tr></thead><tbody>${rows}</tbody></table></div></div>`));
  v.appendChild(el(`<div class="card"><div class="eyebrow">最终目标检查</div>
    <ul class="plain small" style="margin:8px 0 0">
      <li>不看文字，连续说出早晨、学校和晚上的日常活动。</li>
      <li>遇到不懂的内容，会用英语求助或请对方重复。</li>
      <li>能表达需要、喜欢、能力、计划、身体感觉和情绪。</li>
      <li>能用 <b>because</b> 说原因，用 <b>but</b> 说转折。</li>
      <li>能用 <b>First / Then / After that / Finally</b> 讲清顺序。</li>
      <li>能围绕当天真实生活，独立说 1～2 分钟。</li>
    </ul></div>`));
}

function renderMe(){
  const v=document.getElementById("view-me"); v.innerHTML="";
  const s=stats();
  v.appendChild(el(`<div class="card"><div class="eyebrow">我的进度</div>
    <div class="stats" style="margin-top:12px">
      <div class="stat"><b>${s.done}</b><span>学过的场景 / 60</span></div>
      <div class="stat"><b>${s.stars}</b><span>累计星星</span></div>
      <div class="stat"><b>${s.streak}</b><span>连续打卡天数</span></div>
      <div class="stat"><b>${s.reviews}</b><span>完成的复习次数</span></div>
    </div></div>`));
  v.appendChild(el(`<div class="card"><div class="eyebrow">奖章墙</div>
    <div class="badges" style="margin-top:12px">${BADGES.map(b=>`<div class="badge ${b.test(s)?"on":""}">
      <em>${b.emoji}</em><div><b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div></div>`).join("")}</div></div>`));
  const learned = Object.keys(state.records).map(Number).sort((a,b)=>a-b);
  v.appendChild(el(`<div class="card"><div class="eyebrow">我的复习表</div>
    ${learned.length?`<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>场景</th><th>学习日</th><th>复习进度</th><th>下次复习</th></tr></thead><tbody>
    ${learned.map(id=>{const r=state.records[id];return `<tr><td><b>${id}. ${esc(SCENES[id-1].zh)}</b></td><td>${esc(r.learned)}</td>
      <td>${"●".repeat(r.stage||0)}${"○".repeat(Math.max(0,6-(r.stage||0)))}</td>
      <td>${r.next?esc(r.next):"已毕业"}</td></tr>`}).join("")}</tbody></table></div>`
    :'<p class="small muted" style="margin:8px 0 0">还没有记录。去「今天」完成第一课吧！</p>'}</div>`));
  v.appendChild(el(`<div class="card"><div class="eyebrow">给爸爸妈妈的话</div>
    <p class="small" style="margin:8px 0 0">少量、高频、真实使用，比一次背很多更有效。孩子说错时先重复一遍正确说法，再让他跟着说一次，不要打断表达的兴致。每天完成后，一起把星星数一数——这是他看得见的进步。</p>
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="resetBtn">清空全部进度</button></div></div>`));
  document.getElementById("resetBtn").addEventListener("click",()=>{
    if(confirm("确定要清空所有打卡、星星和复习记录吗？")){ state={records:{},reviews:0,days:[]}; save(); render(); toast("已清空，可以重新开始。"); }
  });
}

/* ---------- shell ---------- */
function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.view===name)));
  document.querySelectorAll(".view").forEach(v=>{ v.hidden = v.id!=="view-"+name; });
}
function render(){
  const s=stats();
  document.getElementById("hudStars").textContent=s.stars;
  document.getElementById("hudStreak").textContent=s.streak;
  const d=dueList().length;
  document.getElementById("dueBadge").textContent = d?`(${d})`:"";
  renderToday(); renderReview(); renderAll(); renderPlan(); renderMe();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{ switchTab(t.dataset.view); window.scrollTo({top:0}); }));
document.addEventListener("click",e=>{
  const say=e.target.closest("[data-say]"); if(say){ speak(say.dataset.say); return; }
  const open=e.target.closest("[data-open]"); if(open){ openScene(Number(open.dataset.open)); return; }
  const pa=e.target.closest("[data-playall]");
  if(pa){
    const list=[...pa.closest(".card").querySelectorAll(".sents .e")].map(x=>x.textContent);
    let i=0; const next=()=>{ if(i>=list.length) return; const u=new SpeechSynthesisUtterance(list[i++]);
      u.lang="en-US"; u.rate=.85; if(voice)u.voice=voice; u.onend=next; speechSynthesis.speak(u); };
    speechSynthesis.cancel(); next();
  }
});
const themeBtn=document.getElementById("themeBtn");
themeBtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark?"light":"dark");
});
render();
})();
</script>
